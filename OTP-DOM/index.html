<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>OTP Timer</h1>
    <p>Click the button to send OTP.</p>

    <div class="card">

        <h2>Verify Mobile Number</h2>

        <input type="text" placeholder="+91 9876543210" readonly>

        <div class="otp-box">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
        </div>

        <button id="btn">Send OTP</button>

        <p id="message"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

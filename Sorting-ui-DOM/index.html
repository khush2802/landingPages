<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Sorting</h1>

    <div class="buttons">
        <button onclick="sortName()">Sort Name</button>
        <button onclick="sortAge()">Sort Age</button>
        <button onclick="sortMarks()">Sort Marks</button>
    </div>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>

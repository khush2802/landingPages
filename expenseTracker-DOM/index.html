<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Header -->

    <header>

        <h1>
            <i class="fa-solid fa-wallet"></i>
            Expense Tracker
        </h1>

        <p>Track your daily expenses easily.</p>

    </header>

    <!-- Main -->

    <main>

        <!-- Left Section -->

        <section class="left">

            <div class="card">

                <h2>Add Expense</h2>

                <form id="expenseForm">

                    <label>Expense Name</label>

                    <input
                        type="text"
                        id="expenseName"
                        placeholder="Enter Expense Name"
                    >

                    <label>Amount</label>

                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Enter Amount"
                    >

                    <label>Date</label>

                    <input
                        type="date"
                        id="expenseDate"
                    >

                    <button type="submit">
                        <i class="fa-solid fa-plus"></i>
                        Add Expense
                    </button>

                </form>

            </div>

            <div class="card">

                <h2>Summary</h2>

                <div class="summary">

                    <p>
                        Total Expense :
                        <span id="totalExpense">
                            ₹0
                        </span>
                    </p>

                    <p>
                        Total Entries :
                        <span id="totalEntries">
                            0
                        </span>
                    </p>

                </div>

            </div>

        </section>

        <!-- Right Section -->

        <section class="right">

            <div class="top-buttons">

                <button id="showBtn">
                    Show Expenses
                </button>

                <button id="hideBtn">
                    Hide Expenses
                </button>

            </div>

            <!-- Hidden Initially -->

            <div
                class="expense-container"
                id="expenseContainer"
            >

                <h2>Expense List</h2>

                <table>

                    <thead>

                        <tr>

                            <th>Name</th>

                            <th>Amount</th>

                            <th>Date</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="expenseList">

                    </tbody>

                </table>

                <div
                    class="empty"
                    id="emptyMessage"
                >

                    <i class="fa-solid fa-wallet"></i>

                    <h3>No Expenses Added</h3>

                    <p>Add your first expense.</p>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
